<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Main Platform Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f3;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: inline-block;
            max-width: 500px;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 1.1rem; }
        .btn {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 25px;
            transition: background 0.2s ease;
        }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Welcome to Your SaaS Dashboard</h1>
        <p>This page is now rendering from a real separate HTML file!</p>
        <a href="/inventory" class="btn">Open My Inventory Sub-App →</a>
    </div>
</body>
</html>
